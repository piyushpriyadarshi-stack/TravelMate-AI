services:
  # 1. TravelMate Node/Express Backend Web Service
  - type: web
    name: travelmate-backend
    runtime: node
    rootDir: server
    buildCommand: npm install && npx prisma generate
    startCommand: node src/server.js
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: COGNITO_USER_POOL_ID
        sync: false
      - key: COGNITO_CLIENT_ID
        sync: false
      - key: COGNITO_REGION
        value: us-east-1
      - key: COGNITO_DOMAIN
        sync: false

  # 2. TravelMate React/Vite Frontend Static Site
  - type: static
    name: travelmate-frontend
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_RAZORPAY_KEY_ID
        sync: false
      - key: VITE_COGNITO_USER_POOL_ID
        sync: false
      - key: VITE_COGNITO_CLIENT_ID
        sync: false
      - key: VITE_COGNITO_REGION
        value: us-east-1
      - key: VITE_COGNITO_DOMAIN
        sync: false
